groups:
  - name: baseline
    rules:
      - alert: PrometheusTargetDown
        expr: up{job!="blackbox-https"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus-Ziel nicht erreichbar"
          description: "{{ $labels.job }} auf {{ $labels.instance }} ist seit mehr als fünf Minuten nicht erreichbar."

      - alert: PublicEndpointDown
        expr: probe_success{job="blackbox-https"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "Öffentlicher Dienst nicht erreichbar"
          description: "{{ $labels.instance }} schlägt seit mehr als fünf Minuten beim HTTPS-Test fehl."

      - alert: TLSCertificateExpiresSoon
        expr: >-
          (probe_ssl_earliest_cert_expiry{job="blackbox-https"} > 0)
          and
          (probe_ssl_earliest_cert_expiry{job="blackbox-https"} - time() < 14 * 24 * 60 * 60)
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "TLS-Zertifikat läuft bald ab"
          description: "Das Zertifikat von {{ $labels.instance }} läuft innerhalb von 14 Tagen ab."

      - alert: HostFilesystemLow
        expr: >-
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
          /
          node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
          < 0.15
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Wenig freier Speicherplatz"
          description: "Auf {{ $labels.mountpoint }} sind seit 15 Minuten weniger als 15 % frei."

      - alert: HostFilesystemCritical
        expr: >-
          node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs"}
          /
          node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs"}
          < 0.08
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "Kritisch wenig freier Speicherplatz"
          description: "Auf {{ $labels.mountpoint }} sind seit zehn Minuten weniger als 8 % frei."

      - alert: HostMemoryLow
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Wenig verfügbarer Arbeitsspeicher"
          description: "Auf dem VPS sind seit 15 Minuten weniger als 10 % RAM verfügbar."

      - alert: HostSecurityUpdatesAvailable
        expr: zircula_host_apt_security_updates_available > 0
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Sicherheitsupdates verfügbar"
          description: "Auf dem VPS sind {{ $value | printf \"%.0f\" }} Sicherheitsupdates verfügbar."

      - alert: HostRebootRequired
        expr: zircula_host_reboot_required == 1
        for: 1h
        labels:
          severity: warning
        annotations:
          summary: "Neustart des VPS erforderlich"
          description: "Ein installiertes Paket verlangt seit mindestens einer Stunde einen kontrollierten Neustart des VPS."

      - alert: HostUpdateMetricsStale
        expr: >-
          (time() - zircula_host_update_check_timestamp_seconds > 36 * 60 * 60)
          or
          absent(zircula_host_update_check_timestamp_seconds)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Host-Updateprüfung fehlt oder ist veraltet"
          description: "Die Updateprüfung des VPS hat seit mehr als 36 Stunden keine aktuellen Metriken geliefert."

