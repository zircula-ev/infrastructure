global:
  scrape_interval: 30s
  evaluation_interval: 30s
  external_labels:
    environment: production
    site: manitu-vps

rule_files:
  - /etc/prometheus/alerts/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: blackbox-https
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - https://cloud.zircula.org/status.php
          - https://auth.zircula.org/-/health/ready/
          - https://office.zircula.org/hosting/discovery
          - https://talk.cloud.zircula.org/api/v1/welcome
          - https://vault.zircula.org/alive
          - https://support.zircula.org/health
    relabel_configs:
      - source_labels:
          - __address__
        target_label: __param_target
      - source_labels:
          - __param_target
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: blackbox-exporter
    static_configs:
      - targets:
          - blackbox-exporter:9115
