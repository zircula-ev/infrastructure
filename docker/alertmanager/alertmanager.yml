global:
  resolve_timeout: 5m
  slack_api_url_file: /run/secrets/slack_webhook_url

route:
  receiver: slack
  group_by:
    - alertname
    - job
    - instance
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - receiver: slack
      matchers:
        - alertname="HostRebootRequired"
      repeat_interval: 24h

receivers:
  - name: slack
    slack_configs:
      - channel: "#it-support"
        send_resolved: true
        username: Zircula Monitoring
        title: '{{ if eq .Status "firing" }}ALARM{{ else }}ENTWARNUNG{{ end }}: {{ .CommonLabels.alertname }}'
        title_link: https://monitoring.zircula.org/
        text: >-
          {{ range .Alerts }}
          *{{ .Annotations.summary }}*
          {{ .Annotations.description }}
          {{ end }}

inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal:
      - alertname
      - instance
