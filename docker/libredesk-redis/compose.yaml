services:
  libredesk-redis:
    image: redis:7.4.10-alpine

    container_name: libredesk-redis
    restart: unless-stopped
    user: redis

    env_file:
      - .env
    secrets:
      - libredesk_redis_password
    entrypoint:
      - /bin/sh
      - /usr/local/bin/redis-secure-entrypoint.sh

    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 100

    volumes:
      - type: bind
        source: /srv/zircula/libredesk-redis
        target: /data
        bind:
          create_host_path: false
      - ./redis-secure-entrypoint.sh:/usr/local/bin/redis-secure-entrypoint.sh:ro

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/libredesk_redis_password) redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    external: true
    name: zircula_backend

secrets:
  libredesk_redis_password:
    environment: LIBREDESK_REDIS_PASSWORD
