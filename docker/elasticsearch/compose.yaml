services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.19.19

    container_name: elasticsearch
    restart: unless-stopped
    user: "1000:0"

    env_file:
      - .env

    environment:
      TZ: ${TZ}
      discovery.type: single-node
      cluster.name: zircula-nextcloud-search
      node.name: zircula-search-01
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      xpack.watcher.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      bootstrap.memory_lock: "true"

    volumes:
      - type: bind
        source: /srv/zircula/elasticsearch
        target: /usr/share/elasticsearch/data
        bind:
          create_host_path: false
      - type: bind
        source: ./jvm.options.d/heap.options
        target: /usr/share/elasticsearch/config/jvm.options.d/heap.options
        read_only: true
        bind:
          create_host_path: false

    networks:
      - search

    mem_limit: 3g
    pids_limit: 4096

    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65535
        hard: 65535
      nproc:
        soft: 4096
        hard: 4096

    security_opt:
      - no-new-privileges:true

    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error
          'http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=5s'
          >/dev/null
      interval: 30s
      timeout: 10s
      start_period: 60s
      retries: 5

    logging:
      driver: json-file
      options:
        max-size: 20m
        max-file: "3"

networks:
  search:
    external: true
    name: zircula_search
