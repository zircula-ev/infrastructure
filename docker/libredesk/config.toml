[app]
log_level = "info"
env = "prod"
check_updates = false
# Supplied only through LIBREDESK_APP__ENCRYPTION_KEY.
encryption_key = ""

[app.server]
address = "0.0.0.0:9000"
socket = ""
disable_secure_cookies = false
session_lifetime = "9h"
read_timeout = "5s"
write_timeout = "5s"
max_body_size = 104857600
read_buffer_size = 65536
keepalive_timeout = "10s"

[upload]
provider = "fs"

[upload.fs]
upload_path = "/data/uploads"
expiry = "1h"

[db]
host = "postgres"
port = 5432
user = "libredesk"
# Supplied only through LIBREDESK_DB__PASSWORD.
password = ""
database = "libredesk"
ssl_mode = "disable"
max_open = 15
max_idle = 5
max_lifetime = "300s"

[redis]
address = "libredesk-redis:6379"
user = ""
# Supplied only through LIBREDESK_REDIS__PASSWORD.
password = ""
db = 0

[message]
outgoing_queue_workers = 10
incoming_queue_workers = 10
message_outgoing_scan_interval = "50ms"
incoming_queue_size = 5000
outgoing_queue_size = 5000

[notification]
concurrency = 2
queue_size = 2000

[automation]
worker_count = 10

[autoassigner]
autoassign_interval = "5m"

[webhook]
workers = 5
queue_size = 10000
timeout = "15s"
allowed_hosts = []

[conversation]
unsnooze_interval = "5m"
draft_retention_duration = "360h"
continuity_scan_interval = "5m"

[sla]
evaluation_interval = "5m"
