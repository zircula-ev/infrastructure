services:
  postgres:
    image: postgres:18

    container_name: postgres

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - /srv/zircula/postgres:/var/lib/postgresql/data

    networks:
      - backend

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    external: true
    name: zircula_backend
