services:
  redis:
    image: redis:8

    container_name: redis

    restart: unless-stopped

    command: redis-server --appendonly yes

    volumes:
      - /srv/zircula/redis:/data

    networks:
      - backend

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  backend:
    external: true
    name: zircula_backend
