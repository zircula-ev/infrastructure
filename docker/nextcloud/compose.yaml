services:
  nextcloud:
    image: nextcloud:34.0.2-apache

    container_name: nextcloud

    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: ${TZ}

      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_HOST_PASSWORD_FILE: /run/secrets/redis_password

      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT}

    secrets:
      - redis_password

    volumes:
      - /srv/zircula/nextcloud/html:/var/www/html
      - /srv/zircula/nextcloud/data:/var/www/html/data
      - ./php/conf.d/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro
      - ./templates/update.user.php:/var/www/html/core/templates/update.user.php:ro

    networks:
      - frontend
      - backend

  notify-push:
    image: nextcloud:34.0.2-apache

    container_name: notify-push

    restart: unless-stopped

    user: "33:33"

    init: true

    env_file:
      - .env

    environment:
      TZ: ${TZ}

      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_HOST_PASSWORD_FILE: /run/secrets/redis_password

      NEXTCLOUD_URL: https://cloud.zircula.org
      NEXTCLOUD_DATABASE_PREFIX: oc_

    secrets:
      - redis_password

    entrypoint:
      - /usr/local/bin/notify-push-entrypoint

    volumes:
      - /srv/zircula/nextcloud/html:/var/www/html:ro
      - ./scripts/notify-push-entrypoint:/usr/local/bin/notify-push-entrypoint:ro

    read_only: true

    tmpfs:
      - /tmp

    cap_drop:
      - ALL

    security_opt:
      - no-new-privileges:true

    networks:
      - frontend
      - backend

    healthcheck:
      test:
        - CMD
        - php
        - -r
        - '$$socket = @fsockopen("127.0.0.1", 7867); if (!$$socket) { exit(1); } fclose($$socket);'
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  frontend:
    external: true
    name: zircula_frontend

  backend:
    external: true
    name: zircula_backend

secrets:
  redis_password:
    environment: REDIS_PASSWORD
