services:
  nextcloud:
    image: nextcloud:34.0.1-apache

    container_name: nextcloud

    restart: unless-stopped

    env_file:
      - .env

    environment:
      TZ: ${TZ}

      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

      REDIS_HOST: redis
      REDIS_HOST_PASSWORD_FILE: /run/secrets/redis_password

      PHP_MEMORY_LIMIT: ${PHP_MEMORY_LIMIT}
      PHP_UPLOAD_LIMIT: ${PHP_UPLOAD_LIMIT}

    secrets:
      - redis_password

    volumes:
      - /srv/zircula/nextcloud/html:/var/www/html
      - /srv/zircula/nextcloud/data:/var/www/html/data
      - ./php/conf.d/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini:ro

    networks:
      - frontend
      - backend

networks:
  frontend:
    external: true
    name: zircula_frontend

  backend:
    external: true
    name: zircula_backend

secrets:
  redis_password:
    environment: REDIS_PASSWORD

